spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/oliveconnect_test}
      database: oliveconnect_test
      auto-index-creation: false

oliveconnect:
  seed:
    enabled: false
  geo:
    sfax:
      min-lat: 34.30
      max-lat: 35.40
      min-lng: 9.80
      max-lng: 11.20
  verger:
    max-surface-ha: 1000.0
  recolte:
    max-quantite-kg: 500000.0

jwt:
  secret: test-jwt-secret-key-sfax-2026-super-safe-minimum-256-bits
  expiration-ms: 3600000

cors:
  allowed-origins: "*"
