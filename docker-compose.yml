services:
  mongodb:
    image: mongo:7
    container_name: oliveconnect-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-olive_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-olive_secret_change_me}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-oliveconnect}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
